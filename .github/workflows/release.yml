name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TrueTime ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and run this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publishes an MSIX to the Microsoft Store. Independent of the release job above,
  # so a Store failure never blocks the GitHub Release. No-ops until STORE_APP_ID is
  # set, so forks and un-configured repos skip it. Requires a first manual submission
  # in Partner Center (listing metadata) before automated updates work.
  microsoft-store:
    if: ${{ vars.STORE_APP_ID != '' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: msix

      - name: install frontend dependencies
        run: npm install

      - name: build MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/build-msix.ps1 -Build

      - name: setup msstore CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: configure msstore credentials
        run: >
          msstore reconfigure
          --tenantId "${{ vars.PARTNER_CENTER_TENANT_ID }}"
          --sellerId "${{ vars.PARTNER_CENTER_SELLER_ID }}"
          --clientId "${{ vars.PARTNER_CENTER_CLIENT_ID }}"
          --clientSecret "${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}"

      - name: publish to Microsoft Store
        shell: pwsh
        run: |
          $pkg = Get-ChildItem TrueTime-*.msix | Select-Object -First 1
          if (-not $pkg) { throw 'No MSIX produced by the build step.' }
          msstore publish $pkg.FullName --appId "${{ vars.STORE_APP_ID }}"

  # Publishes the web (Docker) build to Docker Hub. Independent of the release
  # job above, so a registry failure never blocks the GitHub Release. No-ops
  # until DOCKERHUB_USERNAME is set, so forks and un-configured repos skip it.
  # No QEMU: the Dockerfile builds the static assets on the native runner and
  # the per-arch stage only copies files.
  docker-hub:
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/truetime
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
